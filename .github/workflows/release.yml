# Publica dotrino-content DESDE CI, no desde el portátil de nadie.
#
# Sin ningún token: npm cambia un credencial efímero por la identidad OIDC de esta
# ejecución (publicación de confianza), y firma la procedencia él solo. La confianza se
# declara en npmjs.com, por paquete: repo `imdotrino/dotrino-content` y workflow `release.yml`.
# **El nombre de este archivo tiene que coincidir exacto** — si se renombra, hay que
# cambiarlo también allí o la publicación se cae.
#
# Y un SBOM por release, que el CRA da por supuesto y npm no aloja (CUMPLIMIENTO.md §2).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write      # crear la release y subirle el SBOM
  id-token: write      # OIDC: la publicación de confianza y la atestación
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # La publicación de confianza pide Node ≥22.14 y npm ≥11.5.1, y Node 22 trae
          # npm 10: por eso el paso siguiente lo sube. NO se fija una versión exacta —
          # npm 12 exige `^22.22.2`, así que un pin en 22.14 deja el `npm i -g` sin poder
          # instalarse (pasó en dotrino-vault).
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm i -g npm@latest
      - run: npm ci

      # LAS PRUEBAS ANTES DE PUBLICAR. Una versión que no pasa su suite no llega a npm.
      - run: npm test
      # El registro de compatibilidad (dotrino-roadmap, CONVENCIONES §14): nada instalado en
      # una versión marcada rota ni por debajo de lo que exige la ficha. Con @latest, que trae
      # la lista de rotas más nueva. Va antes de publicar: aquí sí frena.
      - run: npx --yes @dotrino/roadmap@latest check

      - name: SBOM (CycloneDX)
        run: |
          npx --yes @cyclonedx/cyclonedx-npm@latest \
            --omit dev --output-format JSON \
            --output-file "sbom-$(node -p "require('./package.json').version").cdx.json"

      - name: Atestiguar el SBOM
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'sbom-*.cdx.json'

      # LO QUE SE PUBLICA ES LO QUE SE MIDE, byte a byte: se empaqueta UNA vez, se mide ese
      # .tgz y se publica ESE archivo. La medida (`npm-integrity.json`) va adjunta a la
      # release `v<versión>` de este repo, y es contra lo que cada instalación comprueba lo
      # que le da npm antes de actualizarse sola (`@dotrino/update/npm`, CONVENCIONES §15).
      # Dos canales: el archivo viene de npm, su hash viene de aquí. Sin ella, esta versión
      # no se instala sola en ninguna máquina.
      - name: Empaquetar
        run: npm pack

      - name: Medir lo que se va a publicar
        run: |
          npx --yes @dotrino/update@latest integrity ./*.tgz > npm-integrity.json
          cat npm-integrity.json

      # La procedencia sale sola: npm la genera y la firma, sin `--provenance`.
      - name: Publicar en npm ESE archivo
        run: npm publish ./*.tgz --access public

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            sbom-*.cdx.json
            npm-integrity.json
          generate_release_notes: true
